<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexBot — Acesso Restrito</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f2744 0%, #13335a 50%, #1e4a7a 100%);
    }

    .login-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .28);
      padding: 44px 40px;
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .login-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1e4a7a, #2d7dd2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      color: #fff;
    }

    .login-card h1 {
      font-size: 1.5rem;
      color: #13335a;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: #64748b;
      font-size: .9rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      color: #1f2937;
      font-size: .98rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .1s;
    }

    .btn-google:hover {
      border-color: #2d7dd2;
      box-shadow: 0 6px 18px rgba(45, 125, 210, .18);
    }

    .btn-google:active { transform: translateY(1px); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    .login-alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: .85rem;
      line-height: 1.5;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .login-alert.show { display: flex; }

    .login-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: .78rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo"><i class="fa-solid fa-robot"></i></div>

      <h1>FlexBot</h1>
      <p class="subtitle">
        Painel de administração — acesso restrito.<br>
        Entre com a conta Google autorizada.
      </p>

      <div class="login-alert" id="login-alert">
        <i class="fa-solid fa-circle-exclamation" style="margin-top: 2px;"></i>
        <span id="login-alert-text"></span>
      </div>

      <a class="btn-google" href="/auth/login">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Entrar com o Google
      </a>

      <div class="login-footer">
        <i class="fa-solid fa-shield-halved"></i>
        Somente contas previamente autorizadas conseguem acessar.<br>
        Todas as tentativas ficam registradas no log do servidor.
      </div>
    </div>
  </div>

  <script>
    const MENSAGENS = {
      naoautorizado: 'Esta conta Google não está autorizada a acessar o painel. Verifique se você entrou com o e-mail correto.',
      naoverificado: 'O e-mail desta conta Google não foi verificado. Verifique-o no Google e tente novamente.',
      state: 'A sessão de login expirou ou foi interrompida. Tente novamente.',
      google: 'Não foi possível concluir a autenticação com o Google. Se o problema persistir, verifique as credenciais no servidor.',
      cancelado: 'Login cancelado. Autorize o acesso para entrar no painel.',
      codigo: 'A resposta do Google veio incompleta. Tente novamente.'
    };

    const erro = new URLSearchParams(window.location.search).get('erro');
    if (erro) {
      const alerta = document.getElementById('login-alert');
      document.getElementById('login-alert-text').textContent = MENSAGENS[erro] || 'Não foi possível entrar. Tente novamente.';
      alerta.classList.add('show');
    }
  </script>
</body>
</html>
